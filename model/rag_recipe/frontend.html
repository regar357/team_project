<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI 레시피 추천 데모</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 12px;
    }

    .input-box {
      margin-bottom: 12px;
    }

    /* 개별 레시피 카드 스타일 */
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      max-width: 700px;
    }

    /* 카드들을 감싸는 컨테이너 */
    #recipeCard {
      max-width: 720px;
      margin-top: 12px;
    }

    #status {
      margin-top: 8px;
      margin-bottom: 8px;
      color: green;
    }

    #recipeCard h3 {
      margin: 0 0 6px 0;
    }

    #recipeCard p {
      margin: 0 0 10px 0;
    }

    #recipeCard h4 {
      margin: 6px 0 4px 0;
      font-size: 15px;
    }

    #recipeCard ul,
    #recipeCard ol {
      margin: 0 0 6px 18px;
      padding: 0;
    }

    #recipeCard li {
      margin: 0 0 2px 0;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <h1>AI 레시피 추천</h1>
  <p>임박한 재료를 쉼표(,)로 구분해서 입력하세요:</p>

  <div class="input-box">
    <input
      id="ingredientsInput"
      size="60"
      placeholder="예: 닭가슴살 300g, 양파 2개, 간장, 마늘"
    />
    <button id="sendBtn">레시피 추천 받기</button>
  </div>

  <!-- 🖼 이미지로 레시피 추천 기능은 현재 사용하지 않으므로 전체 주석 처리
  <p style="margin-top:24px;">또는 음식 사진으로 재료를 인식해 레시피를 추천받을 수도 있어요:</p>
  <div class="input-box">
    <input type="file" id="imageInput" accept="image/*" />
    <button id="sendImageBtn">이미지로 레시피 추천</button>
  </div>
  -->

  <div id="status"></div>

  <h2>최종 레시피</h2>
  <!-- 이 div는 여러 개 레시피 카드를 감싸는 컨테이너 -->
  <div id="recipeCard" style="display:none;"></div>

  <h2 style="margin-top:32px;">최근 추천 기록</h2>
  <div id="history" class="card" style="display:none;"></div>

  <script>
    // ============================
    // 1) 텍스트 재료로 레시피 요청 (렌더링 X, 데이터만 반환)
    // ============================
    async function callRecipeAPI(ingredients, styleHint) {
      const response = await fetch("http://127.0.0.1:8000/recommend", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          ingredients: ingredients,
          style: styleHint,      // ⭐ 백엔드로 스타일 힌트 같이 보냄
        }),
      });

      if (!response.ok) {
        throw new Error("API 오류: " + response.status);
      }

      const data = await response.json();
      return data;
    }

    // ============================
    // 2) 개별 레시피 카드 HTML 생성 함수
    //    → LLM이 비워둔 필드가 있어도 기본 내용은 항상 나오게 처리
    // ============================
    function buildRecipeCardHTML(data, ingredients, index, styleName) {
      const finalRecipe = data.final_recipe || {};

      const titleRaw = finalRecipe.title || "제목 없음";
      const descRaw  = finalRecipe.description || "";

      const desc =
        descRaw.trim().length > 0
          ? descRaw
          : "설명 정보가 없습니다. 입력한 재료를 활용해 간단한 요리를 만들어 보세요.";

      // 여러 키 이름 대응
      const priority =
        finalRecipe["priority used ingredients"] ||
        finalRecipe["priority_used_ingredients"] ||
        [];

      const others =
        finalRecipe["other ingredients"] ||
        finalRecipe["other_ingredients"] ||
        [];

      const rawSteps = finalRecipe.steps || [];
      const steps = rawSteps.map(s => s.replace(/^\s*\d+\.?\s*/, ""));
      const tips = finalRecipe.tips || [];

      // ✅ LLM이 아무것도 안 줘도 기본값으로 채워서 보여주기
      const priorityToShow = priority.length ? priority : (ingredients || []);
      const othersToShow   = others.length   ? others   : [];
      const stepsToShow    = steps.length    ? steps    : [
        "재료를 깨끗이 손질합니다.",
        "재료의 조리 특성에 맞게 끓이거나 볶거나 버무려서 익혀줍니다.",
        "간을 보고 취향에 맞게 조절한 후 접시에 담아 제공합니다."
      ];
      const tipsToShow     = tips.length     ? tips     : [
        "간은 입맛에 맞게 조금씩 조절해 주세요.",
        "재료의 신선도를 확인한 후 사용하면 더 맛있습니다."
      ];

      return `
        <div class="card">
          <div style="max-width: 700px;">

            <h3 style="margin: 0 0 8px 0;">
              추천 레시피 ${index + 1} (${styleName}) : ${titleRaw}
            </h3>
            <p style="margin: 0 0 16px 0;"><b>설명:</b> ${desc}</p>

            <h4 style="margin: 8px 0 4px 0;">입력한 재료</h4>
            <ul style="margin:0 0 8px 18px; padding:0;">
              ${(ingredients || []).map(i => `<li>${i}</li>`).join("")}
            </ul>

            <h4 style="margin: 8px 0 4px 0;">우선 사용 재료</h4>
            <ul style="margin:0 0 8px 18px; padding:0;">
              ${priorityToShow.map(i => `<li>${i}</li>`).join("")}
            </ul>

            <h4 style="margin: 8px 0 4px 0;">다른 재료</h4>
            ${
              othersToShow.length
                ? `<ul style="margin:0 0 8px 18px; padding:0;">
                     ${othersToShow.map(i => `<li>${i}</li>`).join("")}
                   </ul>`
                : `<p style="margin:0 0 8px 0;">추가 재료 정보가 없습니다.</p>`
            }

            <h4 style="margin: 12px 0 4px 0;">조리 순서</h4>
            <ol style="margin:0 0 8px 18px; padding:0;">
              ${stepsToShow.map(s => `<li>${s}</li>`).join("")}
            </ol>

            <h4 style="margin: 12px 0 4px 0;">팁</h4>
            <ul style="margin:0 0 8px 18px; padding:0;">
              ${tipsToShow.map(t => `<li>${t}</li>`).join("")}
            </ul>

          </div>
        </div>
      `;
    }

    // ============================
    // 3) 텍스트 버튼 클릭 시 4개의 레시피 생성
    // ============================
    document.getElementById("sendBtn").addEventListener("click", async () => {
      const inputValue = document.getElementById("ingredientsInput").value;
      const statusDiv  = document.getElementById("status");

      const ingredients = inputValue
        .split(",")
        .map(item => item.trim())
        .filter(item => item.length > 0);

      if (ingredients.length === 0) {
        alert("재료를 한 개 이상 입력해주세요.");
        return;
      }

      // ⭐ 요리 스타일 4개 정의
      const styleHints = ["볶음", "찜", "국/탕", "샐러드"];

      try {
        statusDiv.textContent = "레시피 4개 생성 중...";

        // 스타일별로 4번 호출
        const results = await Promise.all(
          styleHints.map(style => callRecipeAPI(ingredients, style))
        );

        // 카드 렌더링
        const recipeCard = document.getElementById("recipeCard");
        recipeCard.style.display = "block";

        let allCardsHTML = "";
        results.forEach((data, idx) => {
          allCardsHTML += buildRecipeCardHTML(data, ingredients, idx, styleHints[idx]);
        });
        recipeCard.innerHTML = allCardsHTML;

        statusDiv.textContent = "✅ 서로 다른 레시피 4개 생성 완료!";
      } catch (err) {
        console.error(err);
        statusDiv.textContent = "에러 발생: " + err.message;
      }
    });

    // ============================
    // 4) 페이지 로드시 카드 숨기기
    // ============================
    window.addEventListener("load", () => {
      const recipeCard = document.getElementById("recipeCard");
      if (recipeCard) recipeCard.style.display = "none";
    });
  </script>
</body>
</html>
